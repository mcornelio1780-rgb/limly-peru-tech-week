          <div class="full">
            <div class="chips" role="radiogroup">
              <label><input type="radio" name="u" value="yes" checked><span data-i="log_yes"></span></label>
              <label><input type="radio" name="u" value="no"><span data-i="log_no"></span></label>
            </div>
          </div>
          <label class="full"><span data-i="log_q"></span><textarea name="q" data-ip="log_q_ph"></textarea></label>
          <label class="full"><span data-i="log_c"></span><input name="c" autocomplete="off" data-ip="log_c_ph"></label>
          <div class="full" style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-primary" type="submit" data-i="log_save"></button>
            <button class="btn btn-ghost" type="button" id="log-copy" data-i="log_copyall"></button>
          </div>
        </form>
        <div class="entries" id="entries"></div>
      </div>
    </section>

    <section class="block" id="logros">
      <div class="sec-head">
        <h2 data-i="aw_h"></h2>
        <p data-i="aw_p"></p>
      </div>
      <div class="awards" id="awards"></div>
      <p class="partners" data-i="partners"></p>
    </section>

    <section class="block">
      <div class="duo">
        <div>
          <h3 data-i="plans_h"></h3>
          <div class="plans" id="plans"></div>
        </div>
        <div>
          <h3 data-i="team_h"></h3>
          <div class="team" id="team"></div>
        </div>
      </div>
    </section>

    <section class="closing">
      <div>
        <h2 data-i="close_h"></h2>
        <p data-i="close_p"></p>
        <div class="cta">
          <a class="btn btn-primary" href="https://www.limly.io" target="_blank" rel="noopener" data-i="close_cta1"></a>
          <a class="btn btn-ghost" href="#links" data-i="close_cta2"></a>
        </div>
      </div>
      <img src="assets/img/running.webp" alt="">
    </section>
    <footer><span data-i="foot1"></span><span data-i="foot2"></span></footer>
  </div>
</main>

<!-- ======================= LINKS ======================= -->
<main id="p-links" class="page">
  <div class="links-page">
    <div class="avatar"><img src="assets/img/logo.webp" alt=""></div>
    <h1 data-i="lk_h"></h1>
    <p class="bio" data-i="lk_bio"></p>
    <div class="link-list" id="link-list"></div>
    <div class="qr-card">
      <h2 data-i="qr_h"></h2>
      <p data-i="qr_p"></p>
      <div class="qr-frame"><img src="assets/img/qr-linktree.png" data-ialt="qr_alt"></div>
      <p class="qr-url">linktr.ee/limly.communication</p>
      <div class="qr-actions">
        <button class="btn btn-primary" type="button" id="qr-show" data-i="qr_show"></button>
        <button class="btn btn-soft" type="button" id="qr-copy" data-i="qr_copy"></button>
        <a class="btn btn-soft" id="qr-wa" target="_blank" rel="noopener" data-i="qr_wa"></a>
        <button class="btn btn-soft" type="button" id="qr-dl" data-i="qr_dl"></button>
      </div>
      <div class="share-msg" id="share-msg"></div>
      <button class="btn btn-ghost btn-sm" type="button" id="share-copy" style="margin-top:12px" data-i="share_copy"></button>
    </div>
  </div>
</main>

<!-- ======================= PASSPORT ======================= -->
<main id="p-pasaporte" class="page">
  <div class="wrap pp">
    <div class="pp-head">
      <h1 data-i="pp_h"></h1>
      <p data-i="pp_p"></p>
    </div>
    <div class="pp-grid">
      <div class="stage">
        <canvas id="pp" width="1080" height="1080" data-ia="pp_canvas"></canvas>
        <p class="hint" data-i="pp_hint"></p>
      </div>
      <div class="ctrl">
        <div class="panel">
          <h3><i>1</i><span data-i="pp_s1"></span></h3>
          <label class="drop" id="drop">
            <span id="drop-t" data-i="pp_drop"></span>
            <small data-i="pp_drop_sub"></small>
            <input type="file" accept="image/*" id="file" class="sr">
          </label>
          <div class="range"><span data-i="pp_zoom"></span><input type="range" id="zoom" min="1" max="3" step="0.01" value="1" data-ia="pp_zoom"></div>
        </div>
        <div class="panel">
          <h3><i>2</i><span data-i="pp_s2"></span></h3>
          <div class="form" style="margin-top:0">
            <label class="full"><span data-i="pp_name"></span><input id="f-name" maxlength="40" data-ip="pp_name_ph" autocomplete="name"></label>
            <label class="full"><span data-i="pp_role"></span><input id="f-role" maxlength="44" data-ip="pp_role_ph" autocomplete="organization-title"></label>
          </div>
        </div>
        <div class="panel">
          <h3><i>3</i><span data-i="pp_s3"></span></h3>
          <div class="picks" id="picks">
            <button type="button" data-m="waving" aria-pressed="true"><img src="assets/img/waving.webp" alt=""></button>
            <button type="button" data-m="running" aria-pressed="false"><img src="assets/img/running.webp" alt=""></button>
            <button type="button" data-m="wink" aria-pressed="false"><img src="assets/img/wink.webp" alt=""></button>
            <button type="button" data-m="notes" aria-pressed="false"><img src="assets/img/notes.webp" alt=""></button>
          </div>
        </div>
        <div class="panel dl">
          <h3><i>4</i><span data-i="pp_s4"></span></h3>
          <button class="btn btn-primary" type="button" id="pp-dl" data-i="pp_dl"></button>
          <div class="seg" role="group" style="margin-top:8px">
            <button type="button" data-cp="li" aria-pressed="true">LinkedIn</button>
            <button type="button" data-cp="ig" aria-pressed="false">Instagram</button>
          </div>
          <div class="copy-box" id="copy-box" aria-live="polite"></div>
          <div class="gen">
            <button class="btn btn-soft" type="button" id="gen-new" data-i="pp_new"></button>
            <button class="btn btn-soft" type="button" id="gen-ai" data-i="pp_ai" hidden></button>
          </div>
          <button class="btn btn-primary" type="button" id="copy-post" data-i="pp_copy"></button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="qr-full" id="qr-full" role="dialog">
  <button type="button" id="qr-close" data-i="qr_close"></button>
  <img class="logo" src="assets/img/logo.webp" alt="">
  <img class="code" src="assets/img/qr-linktree.png" data-ialt="qr_alt">
  <p data-i="qr_scan"></p>
</div>
<div class="modal" id="modal" role="dialog">
  <img id="modal-img" alt="">
  <p data-i="modal_p"></p>
  <button type="button" id="modal-close" data-i="modal_btn"></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
